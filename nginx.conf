server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip already-compressible text assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Hashed build assets are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any unmatched path (client-side route) serves index.html
    # instead of a 404, so a hard refresh on /jobs/:jobId works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
